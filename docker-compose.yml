version: "3.8"

services:
  babyagi:
    build: .
    ports:
      - "5000:5000"
      - "3000:3000"
    volumes:
      - babyagi-data:/data
    env_file:
      - babyagi3/.env
    environment:
      - BABYAGI_HOST=0.0.0.0
      - BABYAGI_PORT=5000
      - BABYAGI_CORS_ORIGINS=http://localhost:3000
    restart: unless-stopped

volumes:
  babyagi-data:
