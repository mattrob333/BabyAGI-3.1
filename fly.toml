app = "babyagi3"
primary_region = "sjc"

[build]

[env]
  BABYAGI_HOST = "0.0.0.0"
  BABYAGI_PORT = "5000"
  NODE_ENV = "production"
  BABYAGI_DATA_DIR = "/data/.babyagi"
  BABYAGI_CORS_ORIGINS = "https://babyagi3.fly.dev,http://localhost:3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "babyagi_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
